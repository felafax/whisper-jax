<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
        <title id="architecture-title">Whisper JAX transcription flow</title>
        <desc id="architecture-desc">Audio is decoded into chunks and features, transcribed by Whisper JAX on CPU, GPU, or TPU, and decoded and merged into a transcript.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-root { --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --accent: #eb6c36; }
      #architecture-root { color: var(--ink); font-family: 'Geist', Arial, sans-serif; }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture-root .node-name { font: 600 12px 'Geist', Arial, sans-serif; fill: var(--ink); }
      #architecture-root .technical { font: 400 9px 'Geist Mono', monospace; fill: var(--muted); }
      #architecture-root .tag { font: 500 8px 'Geist Mono', monospace; letter-spacing: 0.08em; fill: var(--muted); }
      #architecture-root .legend { font: 400 10px 'Geist', Arial, sans-serif; fill: var(--muted); }
      #architecture-root .diagram-container { overflow-x: visible; }</style>
          <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
          <marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>
        <rect width="960" height="280" fill="#f5f5f5"/>

        <!-- All handoffs share an axis; arrows precede the opaque node masks. -->
        <g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)">
          <line x1="180" y1="120" x2="224" y2="120"/>
          <line x1="428" y1="120" x2="472" y2="120"/>
          <line x1="716" y1="120" x2="760" y2="120"/>
        </g>

        <g>
          <rect x="40" y="80" width="140" height="80" rx="6" fill="#f5f5f5"/>
          <rect x="40" y="80" width="140" height="80" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399"/>
          <rect x="52" y="92" width="40" height="12" rx="2" fill="#f5f5f5"/>
          <text x="72" y="101" class="tag" text-anchor="middle">INPUT</text>
          <text x="56" y="124" class="node-name">Audio</text>
          <text x="56" y="144" class="technical">MP3 / WAV / URL</text>
        </g>

        <g>
          <rect x="228" y="80" width="200" height="80" rx="6" fill="#f5f5f5"/>
          <rect x="228" y="80" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <rect x="240" y="92" width="56" height="12" rx="2" fill="#f5f5f5"/>
          <text x="268" y="101" class="tag" text-anchor="middle">PREPARE</text>
          <text x="244" y="124" class="node-name">Decode &amp; prepare</text>
          <text x="244" y="144" class="technical">ffmpeg / chunks / log-Mel</text>
        </g>

        <g>
          <rect x="476" y="64" width="240" height="112" rx="6" fill="#f5f5f5"/>
          <rect x="476" y="64" width="240" height="112" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/>
          <rect x="492" y="80" width="64" height="12" rx="2" fill="#f5f5f5"/>
          <text x="524" y="89" class="tag" text-anchor="middle">INFERENCE</text>
          <text x="492" y="124" class="node-name">Whisper JAX</text>
          <text x="492" y="148" class="technical">CPU / GPU / TPU</text>
        </g>

        <g>
          <rect x="764" y="80" width="156" height="80" rx="6" fill="#f5f5f5"/>
          <rect x="764" y="80" width="156" height="80" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <rect x="776" y="92" width="48" height="12" rx="2" fill="#f5f5f5"/>
          <text x="800" y="101" class="tag" text-anchor="middle">OUTPUT</text>
          <text x="780" y="124" class="node-name">Transcript</text>
          <text x="780" y="144" class="technical">decode / merge / text</text>
        </g>

        <g>
          <line x1="40" y1="208" x2="920" y2="208" stroke="#bfc0c0" stroke-width="0.8"/>
          <line x1="40" y1="236" x2="64" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
          <text x="76" y="240" class="legend">Audio processing flow</text>
          <rect x="256" y="228" width="16" height="16" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36"/>
          <text x="284" y="240" class="legend">Whisper inference</text>
        </g>
      </svg>
